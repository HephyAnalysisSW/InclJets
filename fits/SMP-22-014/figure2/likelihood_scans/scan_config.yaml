schema_version: 1
status: paired_reference_and_three_point_smoke_validated_relative_gluon
reference_fit: ../reference_fit/fit_result.yaml

scan:
  directions: independent_parameter_axes
  coordinate: hesse_sigma
  range: [-2.0, 2.0]
  points: 21
  minimization: false
  profiling: false
  fixed_nuisances: ../reference_fit/nuisances.yaml
  nuisance_precision: four decimal places from xFitter Results.txt
  require_reference_closure_before_scan: true

reference_closure:
  expected_total_chi2: 1302.418
  max_absolute_chi2_difference: 0.01
  action_on_failure: abort_scan
  result: evaluations/reference_direct_combined/evaluation.yaml
  evaluated_total_chi2: 1302.4176473101982
  delta_chi2: -0.0003526898017298663
  passed: true
  HERA_plus_CMS_decomposition_difference: 4.547473508864641e-13

likelihood_groups:
  - HERA
  - CMS
  - HERA_plus_CMS

projection:
  basis_set: 250503_pod_basis_40k
  reference_member: 0
  basis_members: all
  q_ext_GeV: 1.65
  grid: LHAPDF_XGRID
  x_slice: [36, null]
  flavors: [21, 2, -2, 1, -1, 3, -3, 4, -4, 5, -5]
  # Augments the absolute x*f residual with lambda*(gluon residual/gluon PDF)
  # on the configured high-x interval. This is a projection/closure metric,
  # not an experimental likelihood term or a PDF prior.
  metric: relative_gluon
  relative_weight: 0.1
  relative_x_range: [0.05, 0.99]
  relative_floor: 1.0e-12
  # The u_v=u-ubar and d_v=d-dbar closure terms protect the light-valence
  # combinations controlling the HERA NC data. Like the gluon term, these are
  # a projection metric only, not likelihood contributions or PDF priors.
  relative_valence_weight: 0.1
  relative_valence_x_range: [1.0e-4, 0.1]
  relative_valence_floor: 1.0e-12
  # Photon-exchange F2 proxy: charge-weighted sum e_f^2(q_f+qbar_f), which
  # protects the HERA NC light-sea combination. Projection metric only.
  relative_f2_weight: 3.0
  relative_f2_x_range: [1.0e-4, 0.1]
  relative_f2_floor: 1.0e-12
  coefficient_count: 100

comparisons:
  - direct_external_parameterization
  - full_POD_reconstruction
  - pointwise_chi2_difference

notes:
  - alpha_s is scanned and passed separately; it is not encoded in the POD coefficients.
  - The full basis tests projection/interface/evolution bias, not the later five-mode truncation.
  - HERA and CMS terms must include their correlated, nuisance-penalty, and log-penalty pieces.
  - The retained nuisance values are rounded; record direct-reference chi2 closure before scanning.
  - The production scan uses configurable relative gluon, valence, and F2-proxy closure terms; their weights and x-ranges are recorded above.
  - A validated Bg scan at coordinates [-0.5, 0, 0.5] is stored in smoke_Bg_3point.
  - high_x_gluon_closure shows that the full basis spans the target high-x gluon but the current absolute dist0 projection does not enforce relative tail closure.
