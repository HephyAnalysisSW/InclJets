# Native POD definition consumed by the xFitter POD decomposition.
class: POD
set: 250503_pod_basis_40k
reference_member: 0
basis_members: [1, 2, 3, 4, 5]
active_flavors: all
coefficient_prefix: pod_c_
q0: 1.65
require_matching_q0: true
value_convention: xfx
member_convention: member_minus_reference

# Projection contract retained with the basis configuration. The C++
# decomposition does not use these fields; the external projector does.
projection:
  grid: LHAPDF_XGRID
  x_slice: [36, -20]
  flavors: [21, 2, -2, 1, -1, 3, -3, 4, -4, 5, -5]
  metric: dist0

# Provenance from the installed LHAPDF .info file. QCDNUM analysis settings
# remain configurable independently in parameters.yaml/constants.yaml.
native_theory:
  alpha_s_mz: 0.118
  order_qcd: 2
  flavor_scheme: variable
  num_flavors: 5
  charm_mass_GeV: 1.51
  bottom_mass_GeV: 4.92
  q_min_GeV: 1.65
  q_max_GeV: 100000.0
